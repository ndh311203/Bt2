<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài tập 2</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="container mt-4">

  <h2 class="mb-3">Bảng quản lý sản phẩm</h2>

  <!-- Ô tìm kiếm -->
  <input
    type="text"
    class="form-control mb-3"
    placeholder="Tìm theo tên..."
    oninput="onSearchChanged(this.value)"
  />

  <!-- Nút sắp xếp -->
  <div class="mb-3">
    <button class="btn btn-primary me-2" onclick="sortByName(true)">Tên A-Z</button>
    <button class="btn btn-primary me-2" onclick="sortByName(false)">Tên Z-A</button>
    <button class="btn btn-success me-2" onclick="sortByPrice(true)">Giá tăng</button>
    <button class="btn btn-success" onclick="sortByPrice(false)">Giá giảm</button>
  </div>

  <!-- Bảng -->
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Giá</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 2 - CRUD Posts & Comments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .deleted {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>

<body class="container mt-4">

<h2>Quản lý Posts</h2>

<input id="titleInput" class="form-control mb-2" placeholder="Nhập tiêu đề post">
<button class="btn btn-primary mb-3" onclick="createPost()">Thêm Post</button>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>ID</th>
      <th>Tiêu đề</th>
      <th>Lượt xem</th>
      <th>Hành động</th>
    </tr>
  </thead>
  <tbody id="postTable"></tbody>
</table>

<hr>

<h2>Quản lý Comments</h2>

<input id="commentText" class="form-control mb-2" placeholder="Nội dung comment">
<input id="commentPostId" class="form-control mb-2" placeholder="Post ID">
<input type="hidden" id="commentId">

<button class="btn btn-success mb-3" onclick="saveComment()">Lưu Comment</button>

<ul class="list-group" id="commentList"></ul>

<script src="script.js"></script>
</body>
</html>
